name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable
          rustup default stable
      - name: Build
        shell: bash
        working-directory: desktop
        env:
          GASCHECKER_RULES_KEY: ${{ secrets.GASCHECKER_RULES_KEY }}
        run: |
          npm ci
          npm run build
      - name: Package
        shell: bash
        run: |
          cp desktop/src-tauri/target/release/gas-checker.exe GasChecker.exe
          echo "$(sha256sum GasChecker.exe | cut -d' ' -f1 | tr a-f A-F)  GasChecker.exe" > GasChecker.exe.sha256
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" GasChecker.exe GasChecker.exe.sha256 --generate-notes
