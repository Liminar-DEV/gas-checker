[package]
name = "gas-checker"
version = "2.0.0"
description = "Gas Checker — read-only Minecraft screenshare cheat checker"
license-file = "../LICENSE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
aes-gcm = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_SystemInformation",
] }

[features]
# Standalone is the only mode: no backend, results go to ntfy.sh.
default = ["standalone"]
standalone = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind" # scanner relies on catch_unwind to survive malformed archives
strip = true
